<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    root {
      display: flex;
      justify-content: center;
    }

    body { 
      background-color: #F4D04E; 
      justify-content: center;
      display: flex;
      align-items: center;
    }

    .card {
      position: absolute;
      top: 25%;
      background-color:white;
      font-family: 'Figtree', sans-serif;
      width: 350px;
      border-radius: 10px;
      padding: 20px;
      justify-content: center;
      border: 1px solid black;
      box-shadow: 10px 10px 0px black;
    }

    .card_category {
      font-weight: 800;
      font-family: 'Figtree', sans-serif;
      font-size: 14px;
      display: inline-block;
      background-color: #F4D04E;
      border-radius: 5px;
      font-weight: 700;
      padding: 5px 10px;
      margin-bottom: 10px;
    }

    .card_date{
      font-weight: 450;
      font-family: 'Figtree', sans-serif;
      font-size: 14px;
      letter-spacing: 0px;
      margin-bottom: 10px;
    }

    .card_title {
      font-weight: 800;
      font-family: 'Figtree', sans-serif;
      font-size: 24px;
      line-height: 150%;
      margin-bottom: 10px;
    }

    .card_description {
      font-weight: 450;
      font-family: 'Figtree', sans-serif;
      font-size: 16px;
      color: #6b6b6b;
      margin-bottom: 20px;
    }

    .card_image {
      display: flex;
      justify-content: center;
    }

    .card_author {
      font-weight: 700;
      font-family: 'Figtree', sans-serif;
      display: flex;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .card-author-image {
      size: cover;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-flex;
      margin-right: 10px;
    }

    .bottom {
      position: absolute;
      top: 62.5%;
      left: 50%;
      transform:translate(-50%,50%)
    }
    .attribution { font-size: 11px; text-align: center; align-items: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="card">
    <div class = card_image>
      <img src = "./assets/images/illustration-article.svg" alt = "illustration article">
    </div>
    <br>
    <div class="card_category">
      Learning
    </div>
    <div class="card_date">
      Published 21 Dec 2023
    </div>
    <div class="card_title">
      HTML & CSS foundations
    </div>
    <div class="card_description">
      These languages are the backbone of every website, defining structure, content, and presentation.
    </div>
    <div class="card_author">
      <div class="card-author-image"><img name = "avatar" src = "./assets/images/image-avatar.webp" alt = "Greg Hooper"></div>
      <span>Greg Hooper</span>
    </div>
  </div>


  <div class = "bottom">
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/grace-belle">Grace</a>.
    </div>
  </div>
</body>
</html>
